title: PowerShell script block tampering with AMSI or script block logging
id: 9c2d4b8e-5a1f-4b2c-8e7d-3f6a1c0b9d42
status: experimental
description: >
  A PowerShell script block that reaches into AmsiUtils or into the cached group policy settings that hold
  ScriptBlockLogging. Both are the standard opening moves of a stager: blind the scanner, then stop the logging.
  The attempt is recorded before it takes effect, which is what makes it detectable at all.
references:
  - https://github.com/OTRF/Security-Datasets/tree/master/datasets/atomic/windows/execution/host
author: junting9817
date: 2026-09-16
logsource:
  product: windows
  category: ps_script
detection:
  amsi:
    ScriptBlockText|contains:
      - 'amsiInitF'
      - 'AmsiUtils'
      - 'amsiContext'
  logging:
    ScriptBlockText|contains:
      - 'cachedGroupPolicySettings'
      - 'EnableScriptB'
      - 'ScriptBlockLogging'
  condition: amsi or logging
falsepositives:
  - Security research and defence-evasion training material quoting these names; check who ran it and from where
  - Administrative scripts that read (rather than write) the logging policy
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.001
  - attack.t1059.001
